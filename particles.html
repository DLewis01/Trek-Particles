<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Starship Enterprise Particle Visualiser</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050805;
        color: #9cff9c;
        font-family: Arial, Helvetica, sans-serif;
    }

    #canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    #ui {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10;
        width: 290px;
        padding: 14px;
        border: 1px solid #315b31;
        border-radius: 8px;
        background: rgba(3, 8, 3, 0.88);
        box-shadow: 0 0 25px rgba(60,255,60,.08);
        backdrop-filter: blur(4px);
	display: none;   
 }

    #ui h1 {
        margin: 0 0 10px;
        font-size: 16px;
        font-weight: normal;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 8px 0;
        font-size: 12px;
    }

    input[type="file"] {
        width: 100%;
        font-size: 11px;
        color: #9cff9c;
    }

    input[type="range"] {
        width: 145px;
        accent-color: #68ff68;
    }

    button {
        width: 100%;
        padding: 7px;
        border: 1px solid #477947;
        border-radius: 4px;
        background: #0b160b;
        color: #9cff9c;
        cursor: pointer;
    }

    button:hover {
        background: #132413;
    }

    #hint {
        margin-top: 10px;
        color: #6d9b6d;
        line-height: 1.4;
        font-size: 11px;
    }

    #drop {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: none;
        align-items: center;
        justify-content: center;
        border: 3px dashed #65ff65;
        background: rgba(10, 30, 10, .55);
        color: #9cff9c;
        font-size: 24px;
        pointer-events: none;
    }

    #status {
        margin-top: 8px;
        font-size: 11px;
        color: #7cb77c;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="drop">DROP IMAGE OR SVG HERE</div>


<div id="ui">
    <h1>Particle Simulator</h1>
    <div class="row">
        <span>Particle count</span>
        <input id="count" type="range"
               min="500" max="10000"
               step="100" value="10000">
    </div>
    <div class="row">
        <span>Flow speed</span>
        <input id="speed" type="range"
               min="0.5" max="8"
               step="0.1" value="3">
    </div>
    <div class="row">
        <span>Deflection</span>
        <input id="deflection" type="range"
               min="0" max="3"
               step="0.05" value="1.35">
    </div>
    <div class="row">
        <span>Trail length</span>
        <input id="trail" type="range"
               min="1" max="12"
               step="1" value="5">
    </div>

    <div class="row">
        <span>Particle size</span>
        <input id="size" type="range"
               min="0.5" max="3"
               step="0.1" value="2.5">
    </div>
    <button id="reset">Reset particles</button>
    <div id="status">
        Starship Enterprise
    </div>
    <div id="hint">
        Press SPACE to hide this panel.
    </div>
</div>


<script>
(() => {

    // ============================================================
    // CANVAS AND CONTROLS
    // ============================================================

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const countInput = document.getElementById("count");
    const speedInput = document.getElementById("speed");
    const deflectionInput = document.getElementById("deflection");
    const trailInput = document.getElementById("trail");
    const sizeInput = document.getElementById("size");
    const resetButton = document.getElementById("reset");
    const status = document.getElementById("status");

    let W = 0;
    let H = 0;
    let dpr = 1;

    let particles = [];

    let obstacle = null;
    let obstacleCanvas = null;
    let obstacleCtx = null;

    // Higher resolution collision mask.

    const MASK_H = 240;

    // ============================================================
    // SOURCE IMAGE
    // ============================================================

    let sourceImage = new Image();

    // ============================================================
    // RESIZE
    // ============================================================

    function resize() {

        dpr = Math.min(window.devicePixelRatio || 1, 2);

        W = window.innerWidth;
        H = window.innerHeight;

        canvas.width = W * dpr;
        canvas.height = H * dpr;

        canvas.style.width = W + "px";
        canvas.style.height = H + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (sourceImage.complete && sourceImage.naturalWidth) {
            buildObstacle(sourceImage);
        } else {
            loadDefault();
        }
    }

    // ============================================================
    // IMAGE LOADING
    // ============================================================

    function loadImageFromURL(url, label) {

        const img = new Image();

        img.onload = () => {

            sourceImage = img;

            buildObstacle(img);

            status.textContent = label;

            resetParticles();
        };

        img.onerror = () => {
            status.textContent = "Could not load the image.";
        };

        img.src = url;
    }

    function loadDefault() {

        loadImageFromURL(
            "data:image/svg+xml;charset=utf-8," +
            encodeURIComponent(defaultSVG),
            "Starship Enterprise"
        );
    }

    // ============================================================
    // BUILD COLLISION MASK
    // ============================================================

    function buildObstacle(img) {

        const aspect =
            img.naturalWidth / img.naturalHeight || 1;

        // Wider default object.
        const maxW = Math.min(W * 0.78, 1200);
        const maxH = Math.min(H * 0.58, 500);

        let ow = maxW;
        let oh = ow / aspect;

        if (oh > maxH) {
            oh = maxH;
            ow = oh * aspect;
        }

        obstacle = {
            x: W * 0.53 - ow / 2,
            y: H / 2 - oh / 2,
            w: ow,
            h: oh
        };

        obstacleCanvas = document.createElement("canvas");

        obstacleCanvas.width = MASK_W;
        obstacleCanvas.height = MASK_H;

        obstacleCtx = obstacleCanvas.getContext(
            "2d",
            { willReadFrequently: true }
        );

        obstacleCtx.clearRect(
            0, 0, MASK_W, MASK_H
        );

        obstacleCtx.drawImage(
            img,
            0, 0,
            MASK_W, MASK_H
        );

        const pixels = obstacleCtx.getImageData(
            0, 0, MASK_W, MASK_H
        ).data;

        obstacle.alpha = new Uint8Array(
            MASK_W * MASK_H
        );

        for (
            let i = 0, p = 3;
            i < obstacle.alpha.length;
            i++, p += 4
        ) {
            obstacle.alpha[i] = pixels[p];
        }
    }

    // ============================================================
    // ALPHA LOOKUP
    // ============================================================

    function alphaAtWorld(x, y) {

        if (
            !obstacle ||
            x < obstacle.x ||
            y < obstacle.y ||
            x >= obstacle.x + obstacle.w ||
            y >= obstacle.y + obstacle.h
        ) {
            return 0;
        }

        const u = Math.floor(
            (x - obstacle.x) /
            obstacle.w * (MASK_W - 1)
        );

        const v = Math.floor(
            (y - obstacle.y) /
            obstacle.h * (MASK_H - 1)
        );

        return obstacle.alpha[
            v * MASK_W + u
        ];
    }

    function isSolid(x, y) {
        return alphaAtWorld(x, y) > 40;
    }

    // ============================================================
    // SURFACE NORMAL
    // ============================================================

    function surfaceNormal(x, y) {

        const r = Math.max(
            5,
            Math.min(
                24,
                Math.min(W, H) * 0.018
            )
        );

        const dx = (
            alphaAtWorld(x + r, y) -
            alphaAtWorld(x - r, y)
        ) / 255;

        const dy = (
            alphaAtWorld(x, y + r) -
            alphaAtWorld(x, y - r)
        ) / 255;

        const len = Math.hypot(dx, dy);

        if (len < 0.02) return null;

        return {
            x: dx / len,
            y: dy / len
        };
    }


    function flowAt(x, y) {

        let vx = -1;
        let vy = 0;

        if (!obstacle) {
            return { x: vx, y: vy };
        }

        const strength =
            Number(deflectionInput.value);

        const radius = Math.max(
            18,
            Math.min(65, W * 0.035)
        );

        const samples = 12;

        let pushX = 0;
        let pushY = 0;
        let total = 0;

        for (let i = 0; i < samples; i++) {

            const angle =
                i * Math.PI * 2 / samples;

            const ux = Math.cos(angle);
            const uy = Math.sin(angle);

            for (const fraction of [0.35, 0.65, 1]) {

                const distance =
                    radius * fraction;

                const sx =
                    x + ux * distance;

                const sy =
                    y + uy * distance;

                if (isSolid(sx, sy)) {

                    const weight =
                        Math.pow(
                            1 - fraction * 0.75,
                            2
                        );

                    pushX -= ux * weight;
                    pushY -= uy * weight;

                    total += weight;
                }
            }
        }

        if (total > 0) {

            const magnitude =
                Math.hypot(pushX, pushY);

            if (magnitude > 0.001) {

                const nx =
                    pushX / magnitude;

                const ny =
                    pushY / magnitude;

                const influence =
                    Math.min(1, total / 3) *
                    strength;

                vx += nx * influence * 1.9;
                vy += ny * influence * 2.7;
            }
        }

        const len =
            Math.hypot(vx, vy) || 1;

        return {
            x: vx / len,
            y: vy / len
        };
    }

    // ============================================================
    // PARTICLES
    // ============================================================

    function randomY() {
        return Math.random() * H;
    }

    function makeParticle(initial = false) {

        return {
            x: initial
                ? W * (0.72 + Math.random() * 0.35)
                : W + Math.random() * W * 0.35,

            y: randomY(),

            px: 0,
            py: 0,

            age: Math.random() * 1000,

            seed: Math.random() * Math.PI * 2
        };
    }

    function resetParticles() {

        const n = Number(countInput.value);

        particles = new Array(n);

        for (let i = 0; i < n; i++) {

            particles[i] = makeParticle(true);

            particles[i].px = particles[i].x;
            particles[i].py = particles[i].y;
        }
    }

    function respawn(p) {

        p.x = W + Math.random() * W * 0.15;
        p.y = Math.random() * H;

        p.px = p.x;
        p.py = p.y;

        p.age = 0;
    }

    // ============================================================
    // DRAW ENTERPRISE
    // ============================================================

    function drawObstacle() {

        if (
            !sourceImage.complete ||
            !obstacle
        ) {
            return;
        }

        ctx.save();

        ctx.shadowBlur = 22;

        ctx.shadowColor =
            "rgba(130,255,130,0.16)";

        ctx.globalAlpha = 0.96;

        ctx.drawImage(
            sourceImage,
            obstacle.x,
            obstacle.y,
            obstacle.w,
            obstacle.h
        );

        ctx.restore();
    }

    // ============================================================
    // DRAW PARTICLES
    // ============================================================

    function draw() {

        ctx.fillStyle =
            "rgba(2, 7, 2, 0.24)";

        ctx.fillRect(0, 0, W, H);

        // Background direction lines.

        ctx.save();

        ctx.globalAlpha = 0.08;
        ctx.strokeStyle = "#9cff9c";
        ctx.lineWidth = 1;

        for (let y = 20; y < H; y += 40) {

            ctx.beginPath();

            ctx.moveTo(0, y);
            ctx.lineTo(W, y);

            ctx.stroke();
        }

        ctx.restore();

        // Draw the Enterprise.

        drawObstacle();

        const speed =
            Number(speedInput.value);

        const particleSize =
            Number(sizeInput.value);

        const trail =
            Number(trailInput.value);

        ctx.save();

        ctx.lineCap = "round";

        for (const p of particles) {

            p.px = p.x;
            p.py = p.y;

            const f = flowAt(p.x, p.y);

            // Natural variation.

            const noise =
                Math.sin(
                    p.age * 0.025 + p.seed
                ) * 0.025;

            p.x += f.x * speed;

            p.y +=
                (f.y + noise) * speed;

            p.age++;

            // Collision recovery.

            if (isSolid(p.x, p.y)) {

                const n =
                    surfaceNormal(p.x, p.y);

                if (n) {

                    p.x += n.x * 8;
                    p.y += n.y * 8;

                } else {

                    p.x += speed * 5;

                    p.y +=
                        (Math.random() - 0.5) * 20;
                }
            }

            // Respawn particles.

            if (
                p.x < -40 ||
                p.y < -80 ||
                p.y > H + 80
            ) {
                respawn(p);
            }

            const alpha =
                0.18 +
                Math.min(0.7, speed / 8);

            ctx.strokeStyle =
                `rgba(110,255,110,${alpha})`;

            ctx.lineWidth = particleSize;

            ctx.beginPath();

            ctx.moveTo(p.px, p.py);

            ctx.lineTo(
                p.x - f.x * trail,
                p.y - f.y * trail
            );

            ctx.stroke();
        }

        ctx.restore();

        // Direction indicator.

        ctx.save();

        ctx.globalAlpha = 0.35;
        //ctx.fillStyle = "#9cff9c";
        //ctx.font = "12px monospace";

        //ctx.fillText(
        //    "AIRFLOW  ←",
        //    W - 110,
        //    H - 22
        //);

        ctx.restore();
    }

    // ============================================================
    // ANIMATION LOOP
    // ============================================================

    let lastTime = performance.now();

    function animate(now) {

        const dt = Math.min(
            32,
            now - lastTime
        );

        lastTime = now;

        const steps = Math.max(
            1,
            Math.ceil(dt / 16)
        );

        for (let i = 0; i < steps; i++) {
            draw();
        }

        requestAnimationFrame(animate);
    }


    // ============================================================
    // PARTICLE COUNT CONTROL
    // ============================================================

    countInput.addEventListener(
        "input",
        () => {

            const n =
                Number(countInput.value);

            if (particles.length < n) {

                while (particles.length < n) {

                    particles.push(
                        makeParticle(true)
                    );
                }

            } else {

                particles.length = n;
            }
        }
    );

    // ============================================================
    // RESET BUTTON
    // ============================================================

    resetButton.addEventListener(
        "click",
        resetParticles
    );

    // ============================================================
    // WINDOW RESIZE
    // ============================================================

    window.addEventListener(
        "resize",
        () => {

            resize();
            resetParticles();
        }
    );

    // ============================================================
    // DRAG AND DROP
    // ============================================================

    window.addEventListener(
        "dragover",
        e => {

            e.preventDefault();

            drop.style.display = "flex";
        }
    );

    window.addEventListener(
        "dragleave",
        e => {

            if (e.relatedTarget === null) {

                drop.style.display = "none";
            }
        }
    );

    window.addEventListener(
        "drop",
        e => {

            e.preventDefault();

            drop.style.display = "none";

            const file =
                e.dataTransfer.files[0];

            if (!file) return;

            if (
                file.type.startsWith("image/") ||
                /\.svg$/i.test(file.name)
            ) {

                const url =
                    URL.createObjectURL(file);

                loadImageFromURL(
                    url,
                    file.name
                );

            } else {

                status.textContent =
                    "Please drop an image or SVG file.";
            }
        }
    );


// ============================================================
// CONTROL PANEL VISIBILITY
//
// Hidden by default.
// Press SPACE to toggle visibility.
// ============================================================
const controlPanel = document.getElementById("ui");
let panelVisible = false;
window.addEventListener("keydown", (event) => {
    if (event.code === "Space" && !event.repeat) {
        if (event.target.closest("button, input, select, textarea")) {
    		return;
	}
        // Prevent Space from scrolling the page.
        event.preventDefault();
        panelVisible = !panelVisible;
        controlPanel.style.display =
            panelVisible ? "block" : "none";
    }

});



    // ============================================================
    // INITIALISE
    // ============================================================

    resize();

    resetParticles();

    requestAnimationFrame(animate);

})();
</script>

</body>
</html>
